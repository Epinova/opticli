# Publishes the OptiCli tool package and the OptiCli.Mcp site package (a -preview prerelease of the same version) to
# nuget.org when a version tag (v1.2.3) is pushed.
# Authenticates with nuget.org trusted publishing: no API key is stored in the repository.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Named in the nuget.org trusted publishing policy; add required reviewers to it to approve each release.
    environment: nuget
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange the workflow's OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the main check below needs the branch history

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(dotnet msbuild src/OptiCli/OptiCli.csproj -getProperty:Version)"
          skill="$(sed -n 's/^opticli-version:[[:space:]]*//p' skill/SKILL.md)"
          echo "tag $tag, Directory.Build.props $version, skill/SKILL.md $skill"
          if [ "$tag" != "$version" ] || [ "$tag" != "$skill" ]; then
            echo "::error::Tag v$tag must match <Version> in Directory.Build.props and opticli-version in skill/SKILL.md."
            exit 1
          fi

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      - name: Build
        run: dotnet build opticli.slnx -c Release

      # Project by project, as CI does: failures become annotations that can be read without signing in.
      - name: Test
        shell: pwsh
        run: .github/scripts/test-projects.ps1

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-test-failures.ps1

      - name: Pack
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release -o artifacts
          dotnet pack src/OptiCli.Mcp/OptiCli.Mcp.csproj -c Release -o artifacts

      - name: Check the packages
        run: |
          .github/scripts/check-package.sh artifacts
          .github/scripts/check-mcp-package.sh artifacts "${GITHUB_REF_NAME#v}"

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
