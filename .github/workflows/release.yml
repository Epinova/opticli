# Publishes the OptiCli tool package and the MCP module's site packages, OptiCli.Mcp (CMS 12) and OptiCli.Mcp.Cms13
# (CMS 13), all with the same version, to nuget.org when a version tag (v1.2.3) is pushed, then creates the GitHub
# release with the MCP module's Claude Desktop extension (opticli-cms.mcpb) attached.
# Authenticates with nuget.org trusted publishing: no API key is stored in the repository. The npm package (npm/) follows,
# once the repository variable NPM_PUBLISH is true; see the publish-npm job.
#
# Only the build job runs the repository's code and its dependencies (NuGet packages, npm packages), and it can't get
# the OIDC token that publishes (no id-token permission). It builds, tests, packs and checks everything, and hands the
# packages on as artifacts. The publish jobs check out nothing and build nothing: they download those artifacts, log in
# and push.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the main check below needs the branch history
          persist-credentials: false

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(dotnet msbuild src/OptiCli/OptiCli.csproj -getProperty:Version)"
          skill="$(sed -n 's/^opticli-version:[[:space:]]*//p' skill/SKILL.md)"
          echo "tag $tag, Directory.Build.props $version, skill/SKILL.md $skill"
          if [ "$tag" != "$version" ] || [ "$tag" != "$skill" ]; then
            echo "::error::Tag v$tag must match <Version> in Directory.Build.props and opticli-version in skill/SKILL.md."
            exit 1
          fi

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      # Restores what the packages.lock.json files say, or fails (RestoreLockedMode, as CI=true here).
      - name: Build
        run: dotnet build opticli.slnx -c Release

      # Project by project, as CI does: failures become annotations that can be read without signing in.
      - name: Test
        shell: pwsh
        run: .github/scripts/test-projects.ps1

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-test-failures.ps1

      - name: Pack
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release -o artifacts
          dotnet pack src/OptiCli.Mcp/OptiCli.Mcp.csproj -c Release -o artifacts
          dotnet pack src/OptiCli.Mcp.Cms13/OptiCli.Mcp.Cms13.csproj -c Release -o artifacts

      - name: Check the packages
        run: |
          .github/scripts/check-package.sh artifacts
          .github/scripts/check-mcp-package.sh artifacts "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # No dependency of the extension or the npm package has an install script.
      - name: Pack the Claude Desktop extension
        working-directory: mcp-extension
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs

      - name: Check the extension
        run: .github/scripts/check-mcp-extension.sh mcp-extension/dist/opticli-cms.mcpb "${GITHUB_REF_NAME#v}"

      # npm test builds npm/dist, which publish-npm publishes.
      - name: Build and test the npm package
        working-directory: npm
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          version="$(node -p "require('./dist/package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::npm/dist has version $version, not ${GITHUB_REF_NAME#v}."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget
          path: artifacts/*.nupkg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: mcp-extension/dist/opticli-cms.mcpb
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm
          path: npm/dist
          if-no-files-found: error

  # Pushes the three packages the build job made. Checks out nothing and runs none of the repository's code.
  publish-nuget:
    needs: build
    runs-on: ubuntu-latest
    # Named in the nuget.org trusted publishing policy; add required reviewers to it to approve each release.
    environment: nuget
    permissions:
      id-token: write # lets NuGet/login exchange the workflow's OIDC token for a short-lived API key
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nuget
          path: artifacts

      - name: Check the packages are this version's three
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="$(printf '%s\n' "OptiCli.$version.nupkg" "OptiCli.Mcp.$version.nupkg" "OptiCli.Mcp.Cms13.$version.nupkg" | sort)"
          found="$(find artifacts -mindepth 1 -printf '%f\n' | sort)"
          if [ "$found" != "$expected" ]; then
            echo "::error::Expected $(tr '\n' ' ' <<<"$expected"), found $(tr '\n' ' ' <<<"$found")."
            exit 1
          fi

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The npm package (npm/dist from the build job), after the CLI is on nuget.org, so the opticli it needs can be
  # installed. npm trusted publishing (this workflow and the environment npm, named in the package's settings on
  # npmjs.com) needs the package to exist, so the first version is published by hand and NPM_PUBLISH set to true after;
  # until then this job is skipped. A version that is on npm already (that first one) is left as it is. Checks out
  # nothing and runs none of the repository's code.
  publish-npm:
    needs: [build, publish-nuget]
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm exchanges the workflow's OIDC token for the publish, and signs its provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm
          path: dist

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@11.21.3 --ignore-scripts --no-audit --no-fund

      - name: Publish
        working-directory: dist
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::npm/dist has version $version, not ${GITHUB_REF_NAME#v}."
            exit 1
          fi
          if npm view "@epinova/opticli@$version" version >/dev/null 2>&1; then
            echo "@epinova/opticli@$version is on npm already."
            exit 0
          fi
          npm publish --access public --ignore-scripts

  # The GitHub release, after the packages are on nuget.org: the version's CHANGELOG section as notes, and the extension
  # as an asset (the same name every release, so .../releases/latest/download/opticli-cms.mcpb always has the newest).
  # A re-run replaces the asset of a release that already exists.
  github-release:
    needs: [build, publish-nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For CHANGELOG.md; gh gets its token from GH_TOKEN below, so the checkout keeps none.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" opticli-cms.mcpb --clobber
            exit 0
          fi
          awk -v v="$version" 'index($0, "## " v " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat >> notes.md <<NOTES

          ---

          Packages on nuget.org: [OptiCli $version](https://www.nuget.org/packages/OptiCli/$version), and the MCP module
          [OptiCli.Mcp $version](https://www.nuget.org/packages/OptiCli.Mcp/$version) for CMS 12 and
          [OptiCli.Mcp.Cms13 $version](https://www.nuget.org/packages/OptiCli.Mcp.Cms13/$version) for CMS 13.
          **opticli-cms.mcpb** below is the Claude Desktop extension for sites that run either; see
          [Connecting Claude](https://github.com/Epinova/opticli/blob/main/docs/reference/mcp/connecting.md#connecting-claude).
          NOTES
          gh release create "$GITHUB_REF_NAME" opticli-cms.mcpb --verify-tag --title "opticli $version" --notes-file notes.md
