# Publishes the OptiCli tool package and the MCP module's site packages, OptiCli.Mcp (CMS 12) and OptiCli.Mcp.Cms13
# (CMS 13), all with the same version, to nuget.org when a version tag (v1.2.3) is pushed, then creates the GitHub
# release with the MCP module's Claude Desktop extension (opticli-cms.mcpb) attached.
# Authenticates with nuget.org trusted publishing: no API key is stored in the repository. The npm package (npm/) follows,
# once the repository variable NPM_PUBLISH is true; see the npm job.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Named in the nuget.org trusted publishing policy; add required reviewers to it to approve each release.
    environment: nuget
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange the workflow's OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the main check below needs the branch history

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(dotnet msbuild src/OptiCli/OptiCli.csproj -getProperty:Version)"
          skill="$(sed -n 's/^opticli-version:[[:space:]]*//p' skill/SKILL.md)"
          echo "tag $tag, Directory.Build.props $version, skill/SKILL.md $skill"
          if [ "$tag" != "$version" ] || [ "$tag" != "$skill" ]; then
            echo "::error::Tag v$tag must match <Version> in Directory.Build.props and opticli-version in skill/SKILL.md."
            exit 1
          fi

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that isn't on main."
            exit 1
          fi

      - name: Build
        run: dotnet build opticli.slnx -c Release

      # Project by project, as CI does: failures become annotations that can be read without signing in.
      - name: Test
        shell: pwsh
        run: .github/scripts/test-projects.ps1

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-test-failures.ps1

      - name: Pack
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release -o artifacts
          dotnet pack src/OptiCli.Mcp/OptiCli.Mcp.csproj -c Release -o artifacts
          dotnet pack src/OptiCli.Mcp.Cms13/OptiCli.Mcp.Cms13.csproj -c Release -o artifacts

      - name: Check the packages
        run: |
          .github/scripts/check-package.sh artifacts
          .github/scripts/check-mcp-package.sh artifacts "${GITHUB_REF_NAME#v}"

      # Packed and checked before anything is pushed; the release job below attaches it.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pack the Claude Desktop extension
        working-directory: mcp-extension
        run: |
          npm ci --no-audit --no-fund
          node build.mjs

      - name: Check the extension
        run: .github/scripts/check-mcp-extension.sh mcp-extension/dist/opticli-cms.mcpb "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: mcp-extension/dist/opticli-cms.mcpb
          if-no-files-found: error

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The npm package (npm/), after the CLI is on nuget.org, so the opticli it needs can be installed. npm trusted
  # publishing (this workflow and the environment npm, named in the package's settings on npmjs.com) needs the package to
  # exist, so the first version is published by hand and NPM_PUBLISH set to true after; until then this job is skipped. A
  # version that is on npm already (that first one) is left as it is. While the package is a preview (npm/build.mjs), it
  # is published under the npm tag preview, not latest.
  npm:
    needs: publish
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm exchanges the workflow's OIDC token for the publish, and signs its provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Build and test
        working-directory: npm
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Publish
        working-directory: npm/dist
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME#v}-preview" ]; then
            echo "::error::npm/dist has version $version, not ${GITHUB_REF_NAME#v}-preview."
            exit 1
          fi
          if npm view "opticli@$version" version >/dev/null 2>&1; then
            echo "opticli@$version is on npm already."
            exit 0
          fi
          npm publish --tag preview --access public

  # The GitHub release, after the packages are on nuget.org: the version's CHANGELOG section as notes, and the extension
  # as an asset (the same name every release, so .../releases/latest/download/opticli-cms.mcpb always has the newest).
  # A re-run replaces the asset of a release that already exists.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: extension

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" opticli-cms.mcpb --clobber
            exit 0
          fi
          awk -v v="$version" 'index($0, "## " v " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat >> notes.md <<NOTES

          ---

          Packages on nuget.org: [OptiCli $version](https://www.nuget.org/packages/OptiCli/$version), and the MCP module
          [OptiCli.Mcp $version](https://www.nuget.org/packages/OptiCli.Mcp/$version) for CMS 12 and
          [OptiCli.Mcp.Cms13 $version](https://www.nuget.org/packages/OptiCli.Mcp.Cms13/$version) for CMS 13.
          **opticli-cms.mcpb** below is the Claude Desktop extension for sites that run either; see
          [Connecting Claude](https://github.com/epinova/opticli#connecting-claude).
          NOTES
          gh release create "$GITHUB_REF_NAME" opticli-cms.mcpb --verify-tag --title "opticli $version" --notes-file notes.md
