# Builds and runs the unit tests on every push and pull request, on the three operating systems opticli supports.
# Every project under tests/ runs, the MCP module's included; the integration tests (OptiCli.Integration and
# OptiCli.Mcp.Integration) skip themselves: they need a running site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build opticli.slnx -c Release

      # One results folder per project: run from the solution, they would share one .trx name and overwrite it.
      - name: Test
        shell: pwsh
        run: |
          $failed = $false
          foreach ($project in Get-ChildItem tests -Recurse -Filter *.csproj) {
            dotnet test $project.FullName -c Release --no-build --logger trx --results-directory "TestResults/$($project.BaseName)"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # Annotations show on the run's summary page without signing in; the log needs it. GitHub keeps 10 errors a step.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Output "::error title=No test results::dotnet test wrote no .trx file" }
          foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $summary = $trx.TestRun.ResultSummary
            $project = $file.Directory.Name
            Write-Output "::notice title=$project::$($summary.outcome): $($summary.Counters.passed) passed, $($summary.Counters.failed) failed of $($summary.Counters.total)"
            foreach ($info in @($summary.RunInfos.RunInfo | Where-Object { $_ -and $_.outcome -eq 'Error' -and $_.Text -notmatch '\[SKIP\]' })) {
              Write-Output "::error title=$project run::$(($info.Text -replace "`r?`n", ' | '))"
            }
            foreach ($result in @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')) {
              $info = $result.Output.ErrorInfo
              $trace = ($info.StackTrace -split "`n" | Select-Object -First 4) -join ' | '
              Write-Output "::error title=$($result.testName)::$("$($info.Message) | $trace" -replace "`r?`n", ' ')"
            }
          }

      - name: Check the package
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release --no-build -o artifacts
          .github/scripts/check-package.sh artifacts
