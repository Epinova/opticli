# Builds and runs the unit tests on every push and pull request, on the three operating systems opticli supports.
# Every project under tests/ runs, the MCP module's included; the integration tests (OptiCli.Integration and
# OptiCli.Mcp.Integration) skip themselves: they need a running site. OptiCli.Agent.Tests runs twice, for the CMS 12
# (net8.0) and CMS 13 (net10.0) agent builds (OptiCli.Agent.Commerce.Tests likewise, for the Commerce agent's), and OptiCli.Mcp.Tests twice, for the MCP module's two packages
# (OptiCli.Mcp, net8.0; OptiCli.Mcp.Cms13, net10.0). On Windows, LocalDbTests must pass (it skips itself elsewhere).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build opticli.slnx -c Release

      # LocalDB (the CMS templates' connection string) exists only on Windows. windows-latest has it as a Visual Studio
      # component; only if it's missing, Microsoft's MSI is installed (pinned SHA-256). Start the default instance, and make
      # LocalDbTests fail rather than skip.
      - name: Start SQL Server Express LocalDB
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/start-localdb.ps1

      - name: Test
        shell: pwsh
        env:
          OPTICLI_REQUIRE_LOCALDB: ${{ runner.os == 'Windows' && '1' || '' }}
        run: .github/scripts/test-projects.ps1

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-test-failures.ps1

      - name: Check the packages
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release --no-build -o artifacts
          .github/scripts/check-package.sh artifacts
          dotnet pack src/OptiCli.Mcp/OptiCli.Mcp.csproj -c Release --no-build -o artifacts
          dotnet pack src/OptiCli.Mcp.Cms13/OptiCli.Mcp.Cms13.csproj -c Release --no-build -o artifacts
          .github/scripts/check-mcp-package.sh artifacts "$(dotnet msbuild src/OptiCli.Mcp/OptiCli.Mcp.csproj -getProperty:Version)"

  # The Claude Desktop extension for the MCP module (mcp-extension/): packs and checks it.
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Pack
        working-directory: mcp-extension
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs

      - name: Check
        run: .github/scripts/check-mcp-extension.sh mcp-extension/dist/opticli-cms.mcpb

  # The npm package (npm/): checks that its generated commands (npm/src/generated) are what this CLI's schema gives,
  # type-checks it, builds it and tests it against a stand-in opticli, then lists what a publish would contain.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # The generator runs the CLI (`opticli schema --json`): SDK 10 builds it (and its CMS 13 agent), the 8 runtime runs it.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the CLI
        run: dotnet build src/OptiCli/OptiCli.csproj -c Release

      - name: Check the generated commands
        working-directory: npm
        env:
          OPTICLI: ${{ github.workspace }}/src/OptiCli/bin/Release/net8.0/opticli.dll
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          # Untracked files too: a new generated file that wasn't committed.
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --short -- src/generated
            git diff -- src/generated
            echo "::error::npm/src/generated is out of date: build the CLI, run npm run generate in npm/, and commit the result."
            exit 1
          fi

      - name: Build and test
        working-directory: npm
        run: |
          npm run typecheck
          npm test
          npm pack --dry-run ./dist
