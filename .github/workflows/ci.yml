# Builds and runs the unit tests on every push and pull request, on the three operating systems opticli supports.
# Every project under tests/ runs, the MCP module's included; the integration tests (OptiCli.Integration and
# OptiCli.Mcp.Integration) skip themselves: they need a running site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build opticli.slnx -c Release

      - name: Test
        shell: pwsh
        run: .github/scripts/test-projects.ps1

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: .github/scripts/report-test-failures.ps1

      - name: Check the package
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release --no-build -o artifacts
          .github/scripts/check-package.sh artifacts
