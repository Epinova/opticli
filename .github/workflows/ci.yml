# Builds and runs the unit tests on every push and pull request, on the three operating systems opticli supports.
# The integration test skips itself: it needs a running site.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # SDK 10 reads opticli.slnx; the 8 runtime runs the net8.0 test projects.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build opticli.slnx -c Release

      - name: Test
        run: dotnet test opticli.slnx -c Release --no-build --logger trx --results-directory TestResults

      # Annotations show on the run's summary page without signing in; the log needs it.
      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Output "::error title=No test results::dotnet test wrote no .trx file" }
          foreach ($file in $files) {
            [xml]$trx = Get-Content $file.FullName
            $summary = $trx.TestRun.ResultSummary
            Write-Output "::notice title=$($file.Name)::$($summary.outcome): $($summary.Counters.passed) passed, $($summary.Counters.failed) failed of $($summary.Counters.total)"
            foreach ($info in @($summary.RunInfos.RunInfo)) {
              if ($info) { Write-Output "::error title=Test run ($($file.Name))::$(($info.Text -replace "`r?`n", ' | ').Substring(0, [Math]::Min(900, $info.Text.Length)))" }
            }
            foreach ($result in @($trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed')) {
              $info = $result.Output.ErrorInfo
              $trace = ($info.StackTrace -split "`n" | Select-Object -First 4) -join ' | '
              Write-Output "::error title=$($result.testName)::$("$($info.Message) | $trace" -replace "`r?`n", ' ')"
            }
          }

      - name: Check the package
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/OptiCli/OptiCli.csproj -c Release --no-build -o artifacts
          .github/scripts/check-package.sh artifacts
